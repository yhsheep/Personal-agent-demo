services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wenlan
      POSTGRES_PASSWORD: wenlan
      POSTGRES_DB: wenlan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenlan -d wenlan"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://wenlan:wenlan@db:5432/wenlan
      USE_EMBEDDED_POSTGRES: "false"
      HOST: 0.0.0.0
      PORT: 8000
      # 也可在 .env 中配置，然后取消下面 env_file 注释
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  pgdata:
